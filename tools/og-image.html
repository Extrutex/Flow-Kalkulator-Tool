<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8edf5;
    background:radial-gradient(700px 400px at 10% 0%,rgba(168,85,247,.55),transparent 60%),
      radial-gradient(600px 400px at 100% 100%,rgba(20,216,196,.4),transparent 60%),
      radial-gradient(500px 300px at 55% 55%,rgba(255,122,26,.18),transparent 60%),#10141d;
    display:flex;flex-direction:column;justify-content:center;padding:0 80px;box-sizing:border-box}
  .kicker{font:600 26px ui-monospace,Menlo,monospace;color:#ffb36b;letter-spacing:.08em;text-transform:uppercase}
  h1{margin:14px 0 10px;font-size:108px;font-weight:800;letter-spacing:-2px;line-height:1;
    background:linear-gradient(90deg,#a855f7,#ff7a1a 55%,#14d8c4);-webkit-background-clip:text;color:transparent}
  p{margin:0;font-size:34px;color:#c9d2e3}
  .blocks{display:flex;gap:14px;margin-top:48px}
  .b{width:74px;height:74px;border-radius:12px;background:repeating-linear-gradient(180deg,#ff9a4a 0 7px,#10141d 7px 10px)}
  .b:nth-child(1){background:repeating-linear-gradient(180deg,#a855f7 0 5px,#10141d 5px 11px)}
  .b:nth-child(2){background:repeating-linear-gradient(180deg,#c26bd9 0 6px,#10141d 6px 10px)}
  .b:nth-child(4){outline:4px solid #14d8c4;outline-offset:4px;background:repeating-linear-gradient(180deg,#ff7a1a 0 9px,#ffb36b 9px 10px)}
  .b:nth-child(6){background:repeating-linear-gradient(180deg,#14d8c4 0 10px,#7ff0e4 10px 11px)}
  .b:nth-child(7){background:repeating-linear-gradient(180deg,#14d8c4 0 11px,#b8fff7 11px 12px)}
  .url{position:absolute;right:80px;bottom:52px;font:500 24px ui-monospace,Menlo,monospace;color:#8d98ab}
</style></head><body>
  <div class="kicker">OrcaSlicer · Flow Ratio</div>
  <h1>Flow-Kalkulator</h1>
  <p>YOLO · 2-Pass · Einwand-Würfel · Verlauf je Filament</p>
  <div class="blocks"><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div></div>
  <div class="url">extrutex.github.io/Flow-Kalkulator-Tool</div>
</body></html>
