<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1030"/>
      <stop offset="0.55" stop-color="#121826"/>
      <stop offset="1" stop-color="#0c2027"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.5" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#14d8c4"/>
    </linearGradient>
    <linearGradient id="lines" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="1140" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.5" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#14d8c4"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT" cx="0.9" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#14d8c4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14d8c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowO" cx="0.55" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .flow { animation: flow 6s linear infinite; }
      @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -240; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glowP)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glowT)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glowO)"/>

  <!-- extrusion lines: under (purple, gaps) -> ideal (orange) -> over (teal, ridges) -->
  <g transform="translate(0 250)" stroke-linecap="round">
    <line x1="60" x2="1140" y1="0" y2="0" stroke="url(#lines)" stroke-width="14" opacity="0.95"/>
    <line x1="60" x2="1140" y1="-22" y2="-22" stroke="url(#lines)" stroke-width="12" opacity="0.6" stroke-dasharray="120 24" class="flow"/>
    <line x1="60" x2="1140" y1="-42" y2="-42" stroke="url(#lines)" stroke-width="10" opacity="0.35" stroke-dasharray="60 30" class="flow"/>
  </g>

  <!-- nozzle -->
  <g transform="translate(1040 62)">
    <rect x="-34" y="-30" width="68" height="36" rx="8" fill="#e8edf5" opacity="0.92"/>
    <path d="M-18 6 L18 6 L6 34 L-6 34 Z" fill="#ff7a1a"/>
    <circle cx="0" cy="44" r="5" fill="#ff7a1a"/>
  </g>

  <text x="600" y="150" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="url(#brand)" letter-spacing="-1">Flow-Kalkulator</text>
</svg>
